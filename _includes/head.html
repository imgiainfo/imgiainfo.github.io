<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — {{ site.title }}</title>
<meta name="description" content="{{ page.description }}">
<meta name="author" content="{{ site.title }}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<link rel="alternate" hreflang="fr" href="{{ site.url }}{{ page.alt_fr }}">
<link rel="alternate" hreflang="en" href="{{ site.url }}{{ page.alt_en }}">
<link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ page.alt_fr }}">
<meta property="og:type" content="website">
{% if page.lang == "en" %}
<meta property="og:locale" content="en_CA">
{% else %}
<meta property="og:locale" content="fr_CA">
{% endif %}
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ page.title }} — {{ site.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- la version change a chaque deploiement : aucun navigateur ne peut garder
     une vieille feuille de style et afficher une page a moitie mise a jour -->
<link rel="stylesheet" href="/assets/css/style.css?v={{ site.time | date: '%s' }}">
